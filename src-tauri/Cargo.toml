[package]
name = "google-home-volume-sync"
version = "0.1.1"
description = "Unofficial Google Home Volume Sync - control and sync volume of Google Cast and other network AV devices"
authors = ["Lee Maskell"]
edition = "2021"

[lib]
name = "ghvs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
prost = "0.13"
mdns-sd = "0.13"
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false }
md5 = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
